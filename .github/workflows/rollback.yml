name: Rollback

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: "Image digest to roll back to (e.g. :fortune-sales-mcp.sha-abc1234.5)"
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: List available images
        run: aws lightsail get-container-images --service-name fortune-sales-mcp

      - name: Deploy
        env:
          MCP_SHARED_SECRET: ${{ secrets.MCP_SHARED_SECRET }}
          RUNTIME_AWS_ACCESS_KEY_ID: ${{ secrets.RUNTIME_AWS_ACCESS_KEY_ID }}
          RUNTIME_AWS_SECRET_ACCESS_KEY: ${{ secrets.RUNTIME_AWS_SECRET_ACCESS_KEY }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          cat > containers.json << EOF
          {
            "mcp": {
              "image": "$IMAGE_DIGEST",
              "environment": {
                "MCP_SHARED_SECRET": "$MCP_SHARED_SECRET",
                "AWS_ACCESS_KEY_ID": "$RUNTIME_AWS_ACCESS_KEY_ID",
                "AWS_SECRET_ACCESS_KEY": "$RUNTIME_AWS_SECRET_ACCESS_KEY",
                "AWS_DEFAULT_REGION": "us-east-1"
              },
              "ports": {
                "8000": "HTTP"
              }
            }
          }
          EOF
          aws lightsail create-container-service-deployment \
            --service-name fortune-sales-mcp \
            --containers file://containers.json \
            --public-endpoint '{"containerName":"mcp","containerPort":8000,"healthCheck":{"path":"/","successCodes":"200-499"}}'
