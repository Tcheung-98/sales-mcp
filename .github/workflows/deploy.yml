name: Deploy

on:
  push:
    branches: [main, dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "LIGHTSAIL_SERVICE=fortune-sales-mcp" >> "$GITHUB_ENV"
            echo "MCP_SHARED_SECRET=${{ secrets.PROD_MCP_SHARED_SECRET }}" >> "$GITHUB_ENV"
            # Prod artifacts bucket is empty; use the populated dev bucket until synced.
            echo "S3_SNAPSHOT_BUCKET=fortune-sales-mcp-dev-artifacts" >> "$GITHUB_ENV"
          else
            echo "LIGHTSAIL_SERVICE=fortune-sales-mcp-dev" >> "$GITHUB_ENV"
            echo "MCP_SHARED_SECRET=${{ secrets.DEV_MCP_SHARED_SECRET }}" >> "$GITHUB_ENV"
            echo "S3_SNAPSHOT_BUCKET=fortune-sales-mcp-dev-artifacts" >> "$GITHUB_ENV"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install lightsailctl
        run: |
          sudo curl -Lo /usr/local/bin/lightsailctl \
            https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl
          sudo chmod +x /usr/local/bin/lightsailctl

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker buildx build --platform linux/amd64 --load -t fortune-sales-ai-mcp:dev .

      - name: Push to Lightsail
        id: push
        run: |
          LABEL="sha-${GITHUB_SHA:0:7}"
          PUSH_OUTPUT=$(aws lightsail push-container-image \
            --service-name "$LIGHTSAIL_SERVICE" \
            --label "$LABEL" \
            --image fortune-sales-ai-mcp:dev 2>&1)
          echo "$PUSH_OUTPUT"
          IMAGE_DIGEST=$(echo "$PUSH_OUTPUT" | awk -F'"' '/Refer to this image/{print $2}')
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Deploy
        env:
          RUNTIME_AWS_ACCESS_KEY_ID: ${{ secrets.RUNTIME_AWS_ACCESS_KEY_ID }}
          RUNTIME_AWS_SECRET_ACCESS_KEY: ${{ secrets.RUNTIME_AWS_SECRET_ACCESS_KEY }}
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
        run: |
          cat > containers.json << EOF
          {
            "mcp": {
              "image": "$IMAGE_DIGEST",
              "environment": {
                "MCP_SHARED_SECRET": "$MCP_SHARED_SECRET",
                "AWS_ACCESS_KEY_ID": "$RUNTIME_AWS_ACCESS_KEY_ID",
                "AWS_SECRET_ACCESS_KEY": "$RUNTIME_AWS_SECRET_ACCESS_KEY",
                "AWS_DEFAULT_REGION": "us-east-1",
                "S3_SNAPSHOT_BUCKET": "$S3_SNAPSHOT_BUCKET"
              },
              "ports": {
                "8000": "HTTP"
              }
            }
          }
          EOF
          aws lightsail create-container-service-deployment \
            --service-name "$LIGHTSAIL_SERVICE" \
            --containers file://containers.json \
            --public-endpoint '{"containerName":"mcp","containerPort":8000,"healthCheck":{"path":"/","successCodes":"200-499"}}'
