[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-mcp"
version = "0.1.0"
description = "Sales MCP server (FastMCP, stdio-first)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp==1.27.1",
]

[tool.setuptools]
py-modules = ["server"]
