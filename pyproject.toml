[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-mcp"
version = "0.1.0"
description = "Sales MCP server (FastMCP, stdio-first)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]==1.27.1",
    "boto3>=1.37",
    "python-pptx>=1.0.0",
    "msal>=1.28",
    "requests>=2.31",
    "pyarrow>=16",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-mock>=3.14",
]

[tool.setuptools]
py-modules = ["server"]
packages = ["ingestion"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
